<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArbitrageX</title>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
        }
        .container {
            max-width: 400px;
            width: 90%;
            background: rgba(30, 30, 30, 0.95);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.4);
            text-align: center;
            animation: fadeIn 0.8s ease-in-out;
            margin-bottom: 10px;
        }
        h2 {
            color: #ffffff;
            margin-bottom: 10px;
        }
        .tagline {
            font-size: 14px;
            color: #b0b0b0;
            margin-bottom: 20px;
        }
        label {
            font-weight: bold;
            display: block;
            text-align: left;
            margin-top: 10px;
            color: #b0b0b0;
        }
        input {
            width: calc(100% - 20px);
            padding: 10px;
            margin-top: 8px;
            border-radius: 5px;
            border: 1px solid #333;
            background: #2a2a2a;
            color: #ffffff;
            font-size: 14px;
        }
        input:focus {
            border-color: #bb86fc;
            outline: none;
        }
        .output {
            margin-top: 25px;
            padding: 15px;
            background: #222;
            border-radius: 8px;
            font-size: 16px;
            text-align: left;
            display: none;
            animation: fadeIn 0.8s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>ArbitrageX</h2>
        <p class="tagline">"Engineered 💰 for profit by Rᴇx"</p>
        <label>Enter Odds (comma-separated):</label>
        <input type="text" id="oddsInput" placeholder="e.g. 2.0, 3.0" oninput="calculateArbitrage()">

        <label>Total Stake:</label>
        <input type="number" id="stakeInput" placeholder="e.g. 100" oninput="calculateArbitrage()">

        <div class="output" id="result"></div>
    </div>

    <script>
        function calculateArbitrage() {
            let oddsInput = document.getElementById("oddsInput").value.trim();
            let stakeInput = parseFloat(document.getElementById("stakeInput").value.trim());

            if (!oddsInput || isNaN(stakeInput) || stakeInput <= 0) {
                document.getElementById("result").style.display = "none";
                return;
            }

            let odds = oddsInput.split(",").map(o => parseFloat(o.trim()));
            if (odds.length < 2 || odds.some(o => isNaN(o) || o <= 1)) {
                document.getElementById("result").style.display = "none";
                return;
            }

            let inverseSum = odds.reduce((sum, o) => sum + (1 / o), 0);
            if (inverseSum >= 1) {
                document.getElementById("result").innerHTML = "<b>No Arbitrage Opportunity!</b>";
                document.getElementById("result").style.display = "block";
                return;
            }

            let stakeDistribution = odds.map(o => ((1 / o) / inverseSum) * stakeInput);
            let payout = stakeDistribution[0] * odds[0];  
            let profit = payout - stakeInput;
            let roi = (profit / stakeInput) * 100;

            document.getElementById("result").innerHTML = `
                <b>Stake Distribution:</b><br> ${stakeDistribution.map(s => `₹${s.toFixed(2)}`).join("<br>")}<br><br>
                <b>Total Payout:</b><br> ₹${payout.toFixed(2)}<br><br>
                <b>Guaranteed Profit:</b><br> ₹${profit.toFixed(2)}<br><br>
                <b>ROI:</b><br> ${roi.toFixed(2)}%
            `;
            document.getElementById("result").style.display = "block";
        }
    </script>
</body>
</html>
